<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Notes Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/contrib/auto-render.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            padding: 20px;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: space-between;
            align-items: center;
        }

        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        button:hover {
            background: #45a049;
        }

        .last-updated {
            font-size: 12px;
            color: #999;
        }

        #content {
            line-height: 1.8;
            font-size: 16px;
        }

        #content h1 {
            color: #2c3e50;
            margin-top: 30px;
            margin-bottom: 15px;
            border-bottom: 3px solid #4CAF50;
            padding-bottom: 10px;
        }

        #content h2 {
            color: #34495e;
            margin-top: 25px;
            margin-bottom: 12px;
        }

        #content h3 {
            color: #555;
            margin-top: 15px;
            margin-bottom: 10px;
        }

        #content p {
            margin-bottom: 12px;
        }

        #content ul, #content ol {
            margin: 12px 0;
            margin-left: 30px;
        }

        #content li {
            margin-bottom: 6px;
        }

        #content code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }

        #content pre {
            background: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 15px 0;
            border-left: 4px solid #4CAF50;
        }

        #content blockquote {
            border-left: 4px solid #4CAF50;
            padding-left: 15px;
            margin: 15px 0;
            color: #666;
            font-style: italic;
        }

        .loading {
            text-align: center;
            color: #999;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #c62828;
        }

        /* KaTeX math rendering */
        .katex-display {
            margin: 15px 0;
            overflow-x: auto;
        }

        .katex {
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <h1 style="margin: 0; font-size: 28px;">Study Notes</h1>
            <div>
                <button onclick="loadNotes()">🔄 Refresh</button>
                <span class="last-updated" id="lastUpdated"></span>
            </div>
        </div>
        <div id="content" class="loading">Loading notes...</div>
    </div>

    <script>
        async function loadNotes() {
            try {
                const response = await fetch('notes.md?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Failed to load notes');
                const markdown = await response.text();
                document.getElementById('content').innerHTML = marked.parse(markdown);
                
                // Render math expressions with KaTeX
                renderMathInElement(document.getElementById('content'), {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ]
                });
                
                document.getElementById('lastUpdated').textContent = 
                    'Last updated: ' + new Date().toLocaleTimeString();
            } catch (error) {
                document.getElementById('content').innerHTML = 
                    '<div class="error">⚠️ Error loading notes: ' + error.message + '</div>';
            }
        }

        // Load notes on page load
        loadNotes();

        // Optional: Reload notes every 5 seconds
        // setInterval(loadNotes, 5000);
    </script>
</body>
</html>
