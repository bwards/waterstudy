<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water Treatment Study</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:         #0f1923;
      --surface:    #172333;
      --surface2:   #1e2f44;
      --border:     #2a3f58;
      --text:       #e8edf2;
      --text-muted: #7a93aa;
      --accent:     #4fa3d1;
      --correct:    #3dbd82;
      --incorrect:  #e05c6a;
      --correct-bg: #1a3d2e;
      --incorrect-bg: #3a1a20;
      --flash:      #f0a045;
      --flash-bg:   #3a2a10;
      --radius:     14px;
      --radius-sm:  8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0 0 80px;
    }

    /* Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 20px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      color: var(--text);
      letter-spacing: 0.01em;
    }

    header h1 span {
      color: var(--accent);
    }

    .score-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .score-badge .correct-count { color: var(--correct); }
    .score-badge .incorrect-count { color: var(--incorrect); }

    /* Filters */
    .filters {
      padding: 16px 24px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .filter-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 8px 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Progress bar */
    .progress-bar-wrap {
      height: 3px;
      background: var(--surface2);
    }

    .progress-bar {
      height: 100%;
      background: var(--accent);
      transition: width 0.4s ease;
    }

    /* Question list */
    .question-list {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Question card */
    .q-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .q-card.answered-correct { border-color: var(--correct); }
    .q-card.answered-incorrect { border-color: var(--incorrect); }
    .q-card.answered-flash { border-color: var(--flash); }

    .q-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px 0;
    }

    .q-type-badge {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 999px;
      padding: 3px 10px;
      border: 1px solid;
    }

    .badge-true_false   { color: var(--accent);    border-color: var(--accent);    background: rgba(79,163,209,0.1); }
    .badge-multi_choice { color: #a78bfa;           border-color: #a78bfa;          background: rgba(167,139,250,0.1); }
    .badge-select_all   { color: var(--correct);   border-color: var(--correct);   background: rgba(61,189,130,0.1); }
    .badge-flashcard    { color: var(--flash);      border-color: var(--flash);     background: rgba(240,160,69,0.1); }

    .q-id {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-left: auto;
    }

    .q-text {
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      font-weight: 500;
      line-height: 1.5;
      padding: 12px 18px 16px;
    }

    .q-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 18px 14px;
    }

    .q-tag {
      font-size: 0.7rem;
      color: var(--text-muted);
      background: var(--surface2);
      border-radius: 4px;
      padding: 2px 8px;
    }

    /* Options */
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 18px 18px;
    }

    .option-btn {
      width: 100%;
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: clamp(0.95rem, 2.2vw, 1.05rem);
      font-weight: 400;
      padding: 16px 18px;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      line-height: 1.4;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(79,163,209,0.08);
    }

    .option-btn.selected-correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: #fff;
    }

    .option-btn.selected-incorrect {
      background: var(--incorrect-bg);
      border-color: var(--incorrect);
      color: #fff;
    }

    .option-btn.reveal-correct {
      border-color: var(--correct);
      color: var(--correct);
    }

    .option-btn:disabled { cursor: default; }

    /* Select all submit */
    .select-all-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      padding: 0 18px 10px;
      font-style: italic;
    }

    .check-btn {
      margin: 0 18px 18px;
      width: calc(100% - 36px);
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      padding: 16px;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .check-btn:disabled { opacity: 0.4; cursor: default; }
    .check-btn:hover:not(:disabled) { opacity: 0.85; }

    /* Feedback */
    .feedback {
      margin: 0 18px 18px;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 10px;
      line-height: 1.4;
    }

    .feedback.show { display: flex; }
    .feedback.correct { background: var(--correct-bg); color: var(--correct); }
    .feedback.incorrect { background: var(--incorrect-bg); color: var(--incorrect); }

    .feedback-icon { font-size: 1.3rem; flex-shrink: 0; }

    /* Flashcard */
    .flashcard-area {
      padding: 0 18px 18px;
    }

    .reveal-btn {
      width: 100%;
      background: var(--flash-bg);
      border: 2px solid var(--flash);
      border-radius: var(--radius-sm);
      color: var(--flash);
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      padding: 16px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .reveal-btn:hover { opacity: 0.85; }

    .flashcard-answer {
      display: none;
      margin-top: 12px;
      background: var(--flash-bg);
      border: 1px solid var(--flash);
      border-radius: var(--radius-sm);
      padding: 16px;
      color: var(--text);
      font-size: clamp(0.95rem, 2.2vw, 1.05rem);
      line-height: 1.6;
      animation: fadeIn 0.2s ease;
    }

    .flashcard-answer.show { display: block; }

    /* Note */
    .q-note {
      margin: 0 18px 16px;
      padding: 10px 14px;
      background: var(--surface2);
      border-left: 3px solid var(--text-muted);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state p { font-size: 1.1rem; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .q-card {
      animation: fadeIn 0.25s ease both;
    }
  </style>
</head>
<body>

<header>
  <h1>Water <span>Treatment</span> Study</h1>
  <div class="score-badge">
    <span class="correct-count" id="correctCount">0</span> /
    <span class="incorrect-count" id="incorrectCount">0</span>
    &nbsp;scored
  </div>
</header>

<div class="progress-bar-wrap">
  <div class="progress-bar" id="progressBar" style="width:0%"></div>
</div>

<div class="filters" id="filters">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="true_false">True / False</button>
  <button class="filter-btn" data-filter="multi_choice">Multiple Choice</button>
  <button class="filter-btn" data-filter="select_all">Select All</button>
  <button class="filter-btn" data-filter="flashcard">Flashcard</button>
</div>

<div class="question-list" id="questionList"></div>

<script>
// ─── Dataset ────────────────────────────────────────────────────────────────
const questions = [
  {
    id: "sii_true_false_1",
    source: "sii",
    type: "true_false",
    number: 1,
    question: "Chlorine is commonly used as a primary disinfectant in municipal water treatment.",
    answer: "True",
    options: [],
    tags: ["disinfection", "chlorine"],
    note: ""
  },
  {
    id: "sii_true_false_2",
    source: "sii",
    type: "true_false",
    number: 2,
    question: "Turbidity is measured in milligrams per litre (mg/L).",
    answer: "False",
    options: [],
    tags: ["measurement", "turbidity"],
    note: "Turbidity is measured in Nephelometric Turbidity Units (NTU)."
  },
  {
    id: "sii_true_false_3",
    source: "sii",
    type: "true_false",
    number: 3,
    question: "Activated carbon is effective at removing dissolved organic compounds from water.",
    answer: "True",
    options: [],
    tags: ["filtration", "activated carbon"]
  },
  {
    id: "sii_multi_choice_1",
    source: "sii",
    type: "multi_choice",
    number: 1,
    question: "What does BOD stand for in water quality testing?",
    answer: "Biological Oxygen Demand",
    options: [
      "Biological Oxygen Demand",
      "Basic Oxygen Data",
      "Bacterial Output Demand",
      "Buffered Oxygen Dose"
    ],
    tags: ["chemistry", "terminology"]
  },
  {
    id: "sii_multi_choice_2",
    source: "sii",
    type: "multi_choice",
    number: 2,
    question: "Which process uses sand and gravel layers to remove suspended solids from water?",
    answer: "Rapid sand filtration",
    options: [
      "Reverse osmosis",
      "Rapid sand filtration",
      "Chlorination",
      "Coagulation"
    ],
    tags: ["filtration"]
  },
  {
    id: "sii_multi_choice_3",
    source: "sii",
    type: "multi_choice",
    number: 3,
    question: "At what pH range is chlorine most effective as a disinfectant?",
    answer: "6.5 – 7.5",
    options: [
      "4.0 – 5.0",
      "6.5 – 7.5",
      "8.5 – 9.5",
      "10.0 – 11.0"
    ],
    tags: ["disinfection", "chlorine", "pH"]
  },
  {
    id: "sii_select_all_1",
    source: "sii",
    type: "select_all",
    number: 1,
    question: "Which of the following are approved primary disinfectants for drinking water?",
    answer: ["Chlorine", "UV radiation", "Ozone"],
    options: ["Chlorine", "Sand filtration", "UV radiation", "Ozone"],
    tags: ["disinfection"]
  },
  {
    id: "sii_select_all_2",
    source: "sii",
    type: "select_all",
    number: 2,
    question: "Which of the following are physical characteristics used to assess water quality?",
    answer: ["Turbidity", "Colour", "Odour"],
    options: ["Turbidity", "pH", "Colour", "Odour"],
    tags: ["water quality", "measurement"],
    note: "pH is a chemical characteristic, not physical."
  },
  {
    id: "sii_flashcard_1",
    source: "sii",
    type: "flashcard",
    number: 1,
    question: "Define 'coagulation' in the context of water treatment.",
    answer: "Coagulation is the process of adding chemicals (coagulants) such as alum to water to destabilize suspended particles, causing them to clump together into larger masses called floc.",
    options: [],
    tags: ["coagulation", "treatment process"]
  },
  {
    id: "sii_flashcard_2",
    source: "sii",
    type: "flashcard",
    number: 2,
    question: "What is the purpose of the contact time (CT) value in disinfection?",
    answer: "CT value (concentration × time) is used to measure disinfection effectiveness. It represents the product of the disinfectant concentration (mg/L) and the contact time (minutes), and is used to ensure adequate inactivation of pathogens.",
    options: [],
    tags: ["disinfection", "CT value"]
  }
];

// ─── State ───────────────────────────────────────────────────────────────────
let correctCount = 0;
let incorrectCount = 0;
let answeredCount = 0;
let currentFilter = "all";

const scoredTypes = ["true_false", "multi_choice", "select_all"];
const scorableQuestions = questions.filter(q => scoredTypes.includes(q.type));

// ─── Render ──────────────────────────────────────────────────────────────────
function typeLabel(type) {
  return {
    true_false:   "True / False",
    multi_choice: "Multiple Choice",
    select_all:   "Select All",
    flashcard:    "Flashcard"
  }[type] || type;
}

function renderTrueFalse(q) {
  return `
    <div class="options">
      <button class="option-btn" data-qid="${q.id}" data-value="True">True</button>
      <button class="option-btn" data-qid="${q.id}" data-value="False">False</button>
    </div>
    <div class="feedback" id="fb-${q.id}">
      <span class="feedback-icon"></span>
      <span class="feedback-text"></span>
    </div>
  `;
}

function renderMultiChoice(q) {
  const btns = q.options.map(opt => `
    <button class="option-btn" data-qid="${q.id}" data-value="${opt}">${opt}</button>
  `).join("");
  return `
    <div class="options">${btns}</div>
    <div class="feedback" id="fb-${q.id}">
      <span class="feedback-icon"></span>
      <span class="feedback-text"></span>
    </div>
  `;
}

function renderSelectAll(q) {
  const btns = q.options.map(opt => `
    <button class="option-btn sa-option" data-qid="${q.id}" data-value="${opt}">${opt}</button>
  `).join("");
  return `
    <p class="select-all-hint">Select all that apply</p>
    <div class="options">${btns}</div>
    <button class="check-btn" id="check-${q.id}" disabled>Check Answer</button>
    <div class="feedback" id="fb-${q.id}">
      <span class="feedback-icon"></span>
      <span class="feedback-text"></span>
    </div>
  `;
}

function renderFlashcard(q) {
  return `
    <div class="flashcard-area">
      <button class="reveal-btn" id="reveal-${q.id}">Reveal Answer</button>
      <div class="flashcard-answer" id="ans-${q.id}">${q.answer}</div>
    </div>
  `;
}

function renderQuestion(q) {
  const tags = q.tags && q.tags.length
    ? `<div class="q-tags">${q.tags.map(t => `<span class="q-tag">${t}</span>`).join("")}</div>`
    : "";

  const note = q.note
    ? `<div class="q-note">📌 ${q.note}</div>`
    : "";

  let body = "";
  if (q.type === "true_false")   body = renderTrueFalse(q);
  if (q.type === "multi_choice") body = renderMultiChoice(q);
  if (q.type === "select_all")   body = renderSelectAll(q);
  if (q.type === "flashcard")    body = renderFlashcard(q);

  return `
    <div class="q-card" id="card-${q.id}" data-type="${q.type}">
      <div class="q-header">
        <span class="q-type-badge badge-${q.type}">${typeLabel(q.type)}</span>
        <span class="q-id">${q.id}</span>
      </div>
      <p class="q-text">${q.question}</p>
      ${tags}
      ${note}
      ${body}
    </div>
  `;
}

function renderAll() {
  const list = document.getElementById("questionList");
  const filtered = currentFilter === "all"
    ? questions
    : questions.filter(q => q.type === currentFilter);

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state"><p>No questions for this filter.</p></div>`;
    return;
  }

  list.innerHTML = filtered.map(renderQuestion).join("");
  attachEvents(filtered);
}

// ─── Events ──────────────────────────────────────────────────────────────────
function showFeedback(qid, correct, correctAnswerText) {
  const fb = document.getElementById(`fb-${qid}`);
  fb.classList.add("show", correct ? "correct" : "incorrect");
  fb.querySelector(".feedback-icon").textContent = correct ? "✓" : "✗";
  fb.querySelector(".feedback-text").textContent = correct
    ? "Correct!"
    : `Incorrect — correct answer: ${correctAnswerText}`;
}

function updateScore() {
  document.getElementById("correctCount").textContent = correctCount;
  document.getElementById("incorrectCount").textContent = incorrectCount;
  const pct = scorableQuestions.length
    ? (answeredCount / scorableQuestions.length) * 100
    : 0;
  document.getElementById("progressBar").style.width = pct + "%";
}

function disableOptions(qid) {
  document.querySelectorAll(`[data-qid="${qid}"]`).forEach(btn => btn.disabled = true);
}

function attachEvents(filtered) {
  // True/False & Multi Choice — immediate on click
  filtered.filter(q => q.type === "true_false" || q.type === "multi_choice").forEach(q => {
    document.querySelectorAll(`[data-qid="${q.id}"]`).forEach(btn => {
      btn.addEventListener("click", () => {
        const selected = btn.dataset.value;
        const correct = selected.trim().toLowerCase() === q.answer.trim().toLowerCase();

        btn.classList.add(correct ? "selected-correct" : "selected-incorrect");

        // Reveal correct answer if wrong
        if (!correct) {
          document.querySelectorAll(`[data-qid="${q.id}"]`).forEach(b => {
            if (b.dataset.value.trim().toLowerCase() === q.answer.trim().toLowerCase()) {
              b.classList.add("reveal-correct");
            }
          });
        }

        disableOptions(q.id);
        showFeedback(q.id, correct, q.answer);

        const card = document.getElementById(`card-${q.id}`);
        card.classList.add(correct ? "answered-correct" : "answered-incorrect");

        if (correct) correctCount++; else incorrectCount++;
        answeredCount++;
        updateScore();
      });
    });
  });

  // Select All — toggle then check button
  filtered.filter(q => q.type === "select_all").forEach(q => {
    const checkBtn = document.getElementById(`check-${q.id}`);
    const saOptions = document.querySelectorAll(`#card-${q.id} .sa-option`);

    saOptions.forEach(btn => {
      btn.addEventListener("click", () => {
        btn.classList.toggle("selected-correct"); // reuse style for selection highlight temporarily
        // Enable check if at least one selected
        const anySelected = [...saOptions].some(b => b.classList.contains("selected-correct"));
        checkBtn.disabled = !anySelected;
      });
    });

    checkBtn.addEventListener("click", () => {
      const selected = [...saOptions]
        .filter(b => b.classList.contains("selected-correct"))
        .map(b => b.dataset.value.trim().toLowerCase());

      const correct = q.answer.map(a => a.trim().toLowerCase());
      const isCorrect =
        selected.length === correct.length &&
        correct.every(a => selected.includes(a));

      // Reset toggle styles, apply real result styles
      saOptions.forEach(btn => {
        btn.classList.remove("selected-correct");
        const val = btn.dataset.value.trim().toLowerCase();
        const wasSelected = selected.includes(val);
        const isCorrectOption = correct.includes(val);

        if (wasSelected && isCorrectOption) btn.classList.add("selected-correct");
        else if (wasSelected && !isCorrectOption) btn.classList.add("selected-incorrect");
        else if (!wasSelected && isCorrectOption) btn.classList.add("reveal-correct");

        btn.disabled = true;
      });

      checkBtn.disabled = true;
      showFeedback(q.id, isCorrect, q.answer.join(", "));

      const card = document.getElementById(`card-${q.id}`);
      card.classList.add(isCorrect ? "answered-correct" : "answered-incorrect");

      if (isCorrect) correctCount++; else incorrectCount++;
      answeredCount++;
      updateScore();
    });
  });

  // Flashcard — reveal toggle
  filtered.filter(q => q.type === "flashcard").forEach(q => {
    const revealBtn = document.getElementById(`reveal-${q.id}`);
    const ansDiv = document.getElementById(`ans-${q.id}`);
    const card = document.getElementById(`card-${q.id}`);

    revealBtn.addEventListener("click", () => {
      ansDiv.classList.toggle("show");
      card.classList.toggle("answered-flash");
      revealBtn.textContent = ansDiv.classList.contains("show") ? "Hide Answer" : "Reveal Answer";
    });
  });
}

// ─── Filters ─────────────────────────────────────────────────────────────────
document.getElementById("filters").addEventListener("click", e => {
  const btn = e.target.closest(".filter-btn");
  if (!btn) return;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentFilter = btn.dataset.filter;
  renderAll();
});

// ─── Init ─────────────────────────────────────────────────────────────────────
renderAll();
updateScore();
</script>
</body>
</html>
