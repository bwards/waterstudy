<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water Treatment Study</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=Public+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:         #0a0e14;
      --bg2:        #131920;
      --surface:    #1a2332;
      --border:     #2a3f58;
      --text:       #e8edf2;
      --text-muted: #7a93aa;
      --accent:     #4fa3d1;
      --accent-dim: #2d6380;
      --correct:    #3dbd82;
      --glow:       rgba(79,163,209,0.15);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Public Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Animated background gradient */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 800px 600px at 20% 30%, rgba(79,163,209,0.08), transparent),
        radial-gradient(ellipse 600px 800px at 80% 70%, rgba(61,189,130,0.05), transparent);
      pointer-events: none;
      z-index: 0;
      animation: gradientShift 20s ease infinite;
    }

    @keyframes gradientShift {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }

    /* Header */
    header {
      position: relative;
      z-index: 10;
      padding: 48px 24px 24px;
      text-align: center;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      font-weight: 300;
      font-style: italic;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeInDown 0.8s ease both;
    }

    .subtitle {
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      font-weight: 300;
      color: var(--text-muted);
      animation: fadeInDown 0.8s 0.1s ease both;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Main container */
    main {
      position: relative;
      z-index: 10;
      flex: 1;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .banks-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Bank card */
    .bank-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      display: block;
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      animation: fadeInUp 0.6s ease both;
    }

    .bank-card:nth-child(1) { animation-delay: 0.1s; }
    .bank-card:nth-child(2) { animation-delay: 0.2s; }
    .bank-card:nth-child(3) { animation-delay: 0.3s; }
    .bank-card:nth-child(4) { animation-delay: 0.4s; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bank-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent, var(--glow));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .bank-card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    }

    .bank-card:hover::before { opacity: 1; }

    .bank-header {
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .bank-title {
      font-family: 'Fraunces', serif;
      font-size: clamp(1.3rem, 3vw, 1.6rem);
      font-weight: 600;
      line-height: 1.2;
      color: var(--text);
    }

    .bank-badge {
      flex-shrink: 0;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .bank-badge.fresh { color: var(--accent); border-color: var(--accent); }
    .bank-badge.in-progress { color: var(--correct); border-color: var(--correct); }



    .cta-text {
      position: relative;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: gap 0.3s ease;
    }

    .bank-card:hover .cta-text {
      gap: 12px;
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
      transition: opacity 0.2s;
    }

    footer a:hover { opacity: 0.7; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 80px 24px;
      animation: fadeInUp 0.6s ease both;
    }

    .empty-state p {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .empty-state-icon {
      font-size: 3rem;
      opacity: 0.3;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<header>
  <h1>Water Treatment Study</h1>
  <p class="subtitle">Choose a question bank to begin</p>
</header>

<main>
  <div class="banks-grid" id="banksGrid"></div>
</main>

<footer>
  <p>Track your progress across question banks • <a href="https://github.com/bwards/waterstudy" target="_blank" rel="noopener">View on GitHub</a></p>
</footer>

<script>
// ─── Question Banks Configuration ────────────────────────────────────────────
const BANKS = [
  {
    id: 'dsa2',
    title: 'Water Treatment Questions: Dataset Sample',
    file: 'dsa2.html',
    totalQuestions: null, // Will be calculated from localStorage or defaults
  },
  // Add more banks here as you create them:
  // { id: 'rr1', title: 'RR1 Advanced Treatment', file: 'rr1.html', totalQuestions: null },
];

// ─── Progress Tracking ───────────────────────────────────────────────────────
function hasStarted(bankId) {
  try {
    const key = `waterstudy_${bankId}`;
    const raw = localStorage.getItem(key);
    if (!raw) return false;
    
    const session = JSON.parse(raw);
    const questionIds = Object.keys(session);
    
    // Check if any questions have been answered
    return questionIds.some(qid => session[qid].answered);
  } catch {
    return false;
  }
}

// ─── Render Banks ────────────────────────────────────────────────────────────
function renderBanks() {
  const grid = document.getElementById('banksGrid');
  
  if (BANKS.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📚</div>
        <p>No question banks configured yet.</p>
      </div>
    `;
    return;
  }
  
  grid.innerHTML = BANKS.map(bank => {
    const started = hasStarted(bank.id);
    const badge = started ? 'in-progress' : 'fresh';
    const badgeText = started ? 'In Progress' : 'New';
    const ctaText = started ? 'Continue' : 'Start';
    
    return `
      <a href="${bank.file}" class="bank-card">
        <div class="bank-header">
          <h2 class="bank-title">${bank.title}</h2>
          <span class="bank-badge ${badge}">${badgeText}</span>
        </div>
        
        <div class="cta-text">
          ${ctaText} <span>→</span>
        </div>
      </a>
    `;
  }).join('');
}

// ─── Init ─────────────────────────────────────────────────────────────────────
renderBanks();
</script>
</body>
</html>
